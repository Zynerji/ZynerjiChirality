[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "zynerji-chirality"
version = "0.2.0"
description = "Chirality detection via dual-helix spectral graph analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rdkit>=2023.03",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
ml = [
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
